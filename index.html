<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="王奕博的个人网站，一个更克制的暗色极简页面。"
  >
  <title>王奕博</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-home">
  <div class="page-shell page-shell-home">
    <main id="top">
      <section class="hero-minimal reveal">
        <p class="hero-kicker">a quiet page</p>
        <h1>王奕博</h1>
        <p class="hero-birthday">20031021</p>
        <a class="button button-quiet" href="contact.html">Contact Me</a>
        <a class="scroll-cue" href="#teams">向下继续</a>
      </section>

      <section class="teams-minimal reveal" id="teams">
        <div class="section-heading section-heading-minimal">
          <p class="eyebrow">My Ingredients</p>
          <h2>That's all.</h2>
        </div>

        <div class="teams-grid teams-grid-large">
          <article class="team-card team-card-minimal reveal">
            <div class="team-logo-wrap team-logo-wrap-large">
              <img
                class="team-logo team-logo-large"
                src="assets/logos/real-madrid.svg"
                alt="皇家马德里俱乐部 logo"
                loading="lazy"
              >
            </div>
            <div class="team-copy team-copy-minimal">
              <p class="card-label">Football</p>
              <h3>皇家马德里</h3>
            </div>
          </article>

          <article class="team-card team-card-minimal reveal">
            <div class="team-logo-wrap team-logo-wrap-large">
              <img
                class="team-logo team-logo-wide team-logo-large"
                src="assets/logos/warriors.svg"
                alt="勇士队 logo"
                loading="lazy"
              >
            </div>
            <div class="team-copy team-copy-minimal">
              <p class="card-label">NBA</p>
              <h3>Warriors</h3>
            </div>
          </article>

          <article class="team-card team-card-minimal reveal">
            <div class="team-logo-wrap team-logo-wrap-large">
              <img
                class="team-logo team-logo-large"
                src="assets/logos/vatality.png"
                alt="Team Vitality logo"
                loading="lazy"
              >
            </div>
            <div class="team-copy team-copy-minimal">
              <p class="card-label">CS</p>
              <h3>Vitality</h3>
            </div>
          </article>

          <article class="team-card team-card-minimal reveal">
            <div class="team-logo-wrap team-logo-wrap-large">
              <img
                class="team-logo team-logo-wide team-logo-large"
                src="assets/logos/blg.png"
                alt="BLG logo"
                loading="lazy"
              >
            </div>
            <div class="team-copy team-copy-minimal">
              <p class="card-label">League of Legends</p>
              <h3>BLG</h3>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
